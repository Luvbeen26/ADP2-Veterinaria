<div class="container">
    <div class="form-card">
        <h1 class="title">Nuevo Registro para {{ petName }}</h1>

        <form [formGroup]="recordForm" (ngSubmit)="onSubmit()">
            <div class="form-row">
                <div class="form-group">
                    <label for="veterinarian">Veterinario</label>
                    <input type="text" id="veterinarian" readonly placeholder="Dr. Zavala Ruiz"class="form-control" />
                </div>

                <div class="form-group">
                    <label for="date">Fecha</label>
                    <input type="date" id="date" formControlName="fecha" class="form-control" readonly/>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="observations">Motivo</label>
                <textarea id="observations" formControlName="motivo" rows="6" class="form-control" 
                    placeholder="Escribe motivo sobre la consulta..."
                ></textarea>
            </div>
            <!-- Observaciones -->
            <div class="form-group full-width">
                <label for="observations">Observaciones</label>
                <textarea id="observations" formControlName="observaciones" rows="6" class="form-control" 
                    placeholder="Escribe observaciones sobre la consulta..."
                ></textarea>
            </div>

            <div class="form-group full-width">
                <label for="observations">Diagnostico</label>
                <textarea id="observations" formControlName="diagnostico" rows="6" class="form-control" 
                    placeholder="Escribe Diagnostico sobre la consulta...">
                </textarea>
            </div>

            
            <div class="treatments-section">
                <h2 class="section-title">Medicamentos y Tratamientos</h2>

                <!-- Desparasitantes -->
                <div class="treatment-option">
                    <label class="checkbox-container">
                        <input 
                            type="checkbox" 
                            [checked]="isTratamientoSelected('desparasitante', 'desparasitate')"
                            (change)="toggleTratamiento('desparasitante', 'desparasitate')"
                        />
                        <span class="checkbox-label">Desparasintate </span>
                    </label>
                </div>

                <!-- Vacunas -->
                <div class="vaccine-section">
                    <h3 class="subsection-title">Vacunas</h3>
                        <div class="checkbox-grid">
                            @for (v of vacunas(); track $index) {
                                <label class="checkbox-container">
                                    <input 
                                        type="checkbox" 
                                        [checked]="isTratamientoSelected('vacuna', v)"
                                        (change)="toggleTratamiento('vacuna', v)"
                                    />
                                    <span class="checkbox-label">{{ v }}</span>
                                </label>
                            }
                        </div>
                    </div>
                <!-- Medicamentos-->
                <div class="vaccine-section">
                    <h3 class="subsection-title">Medicamentos</h3>
                    
                    <div class="checkbox-grid">
                        @for (m of medicamentos(); track $index) {
                            <label class="checkbox-container">
                                <input 
                                    type="checkbox" 
                                    [checked]="isTratamientoSelected('medicamento', m)"
                                    (change)="toggleTratamiento('medicamento', m)"
                                />
                                <span class="checkbox-label">{{ m }}</span>
                            </label>
                        }
                    </div>
                
                </div>
            
            </div>

            <!-- Sección de Cuidados -->
            <div class="treatments-section">
                <h2 class="section-title">Cuidados</h2>
                
                <div class="checkbox-grid">
                    @for (cuidado of cuidadosLst(); track cuidado.id) {
                        <label class="checkbox-container">
                            <input 
                                type="checkbox" 
                                [checked]="isCuidadoSelected(cuidado.id)"
                                (change)="toggleCuidado(cuidado.id)"
                            />
                            <span class="checkbox-label">{{ cuidado.descripcion }}</span>
                        </label>
                    }
                </div>
            
            </div>

            <!-- Botón de Submit -->
            <div class="button-container">
                <button 
                    type="submit" 
                    class="submit-button" 
                    [disabled]="recordForm.invalid"
                >
                    Registrar
                </button>
            </div>
        </form>
    </div>
</div>
