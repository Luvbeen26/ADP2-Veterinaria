<div class="consultas-container flex-column">
    <div class="header-section">
        <h1>Consultas</h1>
        <div class="status-filters">
            <button 
                class="filter-btn" 
                [class.active]="status === 'P'"
                (click)="changeStatus('P')">
                Pendientes
            </button>
            <button 
                class="filter-btn" 
                [class.active]="status === 'A'"
                (click)="changeStatus('A')">
                Aprobadas
            </button>
            <button 
                class="filter-btn" 
                [class.active]="status === 'N'"
                (click)="changeStatus('N')">
                No Aprobadas
            </button>
        </div>
    </div>

    <div class="Container-bydate flex-column">
        @if(dates$ | async; as dates){
            @if(dates.length > 0 ){
                @for (cita_date of dates; track $index) {
                    <h2>{{cita_date.fecha}}</h2>
                    <div class="container-cards flex">
                        @for (cita of cita_date.citas; track $index) {
                            <app-card-consulta [cardconsulta]="cita" [status]="status"></app-card-consulta>
                            
                            
                        } 
                    </div>
                }
            }@else {
                <div class="empty-state flex-column">
                    <div class="empty-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" height="120px" viewBox="0 -960 960 960" width="120px" fill="#D1D5DB">
                            <path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Zm280 240q-17 0-28.5-11.5T440-440q0-17 11.5-28.5T480-480q17 0 28.5 11.5T520-440q0 17-11.5 28.5T480-400Zm-160 0q-17 0-28.5-11.5T280-440q0-17 11.5-28.5T320-480q17 0 28.5 11.5T360-440q0 17-11.5 28.5T320-400Zm320 0q-17 0-28.5-11.5T600-440q0-17 11.5-28.5T640-480q17 0 28.5 11.5T680-440q0 17-11.5 28.5T640-400ZM480-240q-17 0-28.5-11.5T440-280q0-17 11.5-28.5T480-320q17 0 28.5 11.5T520-280q0 17-11.5 28.5T480-240Zm-160 0q-17 0-28.5-11.5T280-280q0-17 11.5-28.5T320-320q17 0 28.5 11.5T360-280q0 17-11.5 28.5T320-240Zm320 0q-17 0-28.5-11.5T600-280q0-17 11.5-28.5T640-320q17 0 28.5 11.5T680-280q0 17-11.5 28.5T640-240Z"/>
                        </svg>
                    </div>
                
                    <h2 class="empty-title">{{empty_title}}</h2>
                    <p class="empty-description">{{empty_description}}</p>
                    
                </div>
            }}
    </div>
    
</div>
