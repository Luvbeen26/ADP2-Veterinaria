<div class="editorial-page my-pets-container flex-column">
    <h1>Mis mascotas</h1>
    <div class="container-list-pets">
        @for (mascota of mascotas(); track $index) {
            <app-card-my-pet [mascota]="mascota" (mascotaEliminada)="onMascotaEliminada($event)"></app-card-my-pet>
        }@empty {
            <div class="empty-message">
                <div class="empty-icon">
                    🐾
                </div>
                <div class="empty-text">
                    No hay mascotas registradas
                </div>
            </div>
        }
    </div>
    <button class="fixed-button" (click)="navigateRegisterPet()">
        <mat-icon aria-hidden="true">add</mat-icon>Registrar mascota
    </button>

</div>
