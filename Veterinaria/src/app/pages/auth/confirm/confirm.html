<main class="body flex">
    <form [formGroup]="codeForm" (ngSubmit)="check_code()" class="form flex-column">
        <h2>Ingrese el código de confirmación de 6 dígitos enviado a su correo electrónico</h2>
        <div class="campo flex-column">
            <button type="button" class="re-send" (click)="Send_email()">Reenviar Codigo</button>
        
        <input type="text" formControlName="code"  maxlength="6" class="input" placeholder="Codigo de Confirmacion" (input)="codeForm.get('code')?.setValue($event.target.value.slice(0,6))">
        </div>
        
        <button type="submit" class="primary_button">Confirmar</button>
    </form>

</main>
