<main class="auth-page editorial-page body flex">
    <form [formGroup]="passwordForm" (ngSubmit)="change_password()" class="form flex-column">
        <h2>Ingrese su nueva contraseña</h2>
        <div class="campo flex-column">
            <input type="password" autocomplete="new-password" aria-label="Nueva contraseña" formControlName="contra" class="input" placeholder="Contrasena nueva">
        </div>
        
        <label>Confirma la contraseña<input type="password" class="input" formControlName="confirm" autocomplete="new-password" required></label>
        <p>Usa entre 15 y 128 caracteres.</p>
        @if (error()) {<p role="alert">{{ error() }}</p>}
        <button [disabled]="busy()" type="submit" class="primary_button">Confirmar</button>
    </form>

</main>
