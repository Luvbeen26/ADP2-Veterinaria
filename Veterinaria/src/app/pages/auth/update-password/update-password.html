<main class="body flex">
    <form [formGroup]="passwordForm" (ngSubmit)="change_password()" class="form flex-column">
        <h2>Ingrese su nueva contraseña</h2>
        <div class="campo flex-column">
            <input type="password" formControlName="contra" class="input" placeholder="Codigo de Confirmacion">
        </div>
        
        <button type="submit" class="primary_button">Confirmar</button>
    </form>

</main>
