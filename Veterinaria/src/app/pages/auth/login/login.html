<main>
    <span class="title"><h1>Bienvenido denuevo</h1></span>

    <div class="contenedor">
        <form [formGroup]="loginForm" (ngSubmit)="Login()" action="" class="form flex-column">
            <label for="" class="campo flex-column">
                <h3>Usuario o correo electronico</h3>
                <input type="email" class="input" placeholder="Ej: usuario123">
                <input type="text" class="input" formControlName="usuario_mail" placeholder="Ej: usuario123">
                @if(loginForm.get('usuario_mail')?.hasError("required") && loginForm.get('usuario_mail')?.touched){
                    <p class="error">Ingrese un usuario o correo</p>
                }
            </label>

            <label for="" class="campo flex-column">
                <h3>Contraseña</h3>
                <input type="password" formControlName="contra" class="input">
                @if(loginForm.get('contra')?.hasError("required") && loginForm.get('contra')?.touched){
                    <p class="error">Ingrese su contraseña</p>
                }
            </label>
            <span class="text right"><a routerLink="/restore" class="button_link">¿Olvidaste tu Contraseña?</a></span>

            <button type="submit"  class="primary_button">Iniciar Sesión</button>

            <span class="text center flex">¿Aun no tienes una cuenta?<a routerLink="/register" class="button_link">Crea una</a></span>
            
           <div class="alert flex" [ngClass]="{'hide': !(error$ | async)}">
                <span class="error-msg">{{ error$ | async }}</span>
            </div>
            
        </form>
        <picture class="flex"><img src="huella.jpg" alt=""></picture>
    </div>
</main>
