<main class="body flex">
    <form [formGroup]="emailForm" (ngSubmit)="Send_email()"  action="" class="form flex-column">
        <h2>Por favor ingrese la dirección de correo electrónico asociada con su cuenta de usuario. Le enviaremos un correo electrónico con instrucciones sobre como restablecer su contraseña.</h2>
        <input formControlName="correo" type="email" class="input" placeholder="Ingrese su correo electronico">
        <div class="Buttons flex">
            <button type="button" routerLink="/login" class="seconday_button">Volver</button>
            <button type="submit" class="primary_button">Confirmar</button>
        </div>
        <div class="alert flex" [ngClass]="{'hide': !(error$ | async)}">
            <span class="error-msg">{{ error$ | async }}</span>
        </div>
        
    </form>

</main>
