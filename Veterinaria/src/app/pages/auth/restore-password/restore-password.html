<main class="auth-page editorial-page body flex">
    <form [formGroup]="emailForm" (ngSubmit)="Send_email()"  action="" class="form flex-column">
        <h1>Recuperar contraseña</h1><p class="auth-intro">Por favor ingrese la dirección de correo electrónico asociada con su cuenta de usuario. Le enviaremos un correo electrónico con instrucciones sobre como restablecer su contraseña.</p>
        <input aria-label="Correo electrónico" autocomplete="email" formControlName="correo" type="email" class="input" placeholder="Ingrese su correo electronico">
        <div class="Buttons flex">
            <button type="button" routerLink="/auth/login" class="seconday_button">Volver</button>
            <button [disabled]="busy()" type="submit" class="primary_button">Confirmar</button>
        </div>
        <div role="alert" class="alert flex" [ngClass]="{'hide': !(error$ | async)}">
            <span class="error-msg">{{ error$ | async }}</span>
        </div>
        
    </form>

</main>
