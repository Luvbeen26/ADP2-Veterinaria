<main>
    <span class="title"><h1>Crea una cuenta</h1></span>

    <form action="" class="form flex-column">
        <section class="campos flex-column">
            <label for="" class="campo flex-column">
                <h3>Nombre(s)</h3>
                <input type="text" class="input" placeholder="Ej: Juan">
            </label>

            <label for="" class="campo flex-column">
                <h3>Apellido(s)</h3>
                <input type="text" class="input" placeholder="Ej: Castro Zuñiga">
            </label>

            <label for="" class="campo flex-column">
                <h3>Usuario</h3>
                <input type="text" class="input" placeholder="Ej: usuario123">
            </label>
            <label for="" class="campo flex-column">
                <h3>Correo electronico</h3>
                <input type="text" class="input" placeholder="Ej: usuario123@gmail.com">
            </label> 
            <label for="" class="campo flex-column">
                <h3>Contraseña</h3>
                <input type="password" class="input" placeholder="Ej: *******">
            </label>                        
            <label for="" class="campo flex-column">
                <h3>Confirmar Contraseña</h3>
                <input type="password" class="input" placeholder="Ej: *******">
            </label>     
        </section>
        <button class="primary_button">Registrarse</button>
        <span class="text center flex">¿Ya tienes una cuenta?<a routerLink="/login" class="button_link">Iniciar Sesion</a></span>
    </form>

</main>
