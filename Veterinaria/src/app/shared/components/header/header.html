<header class="header flex">
    <div class="img_logo" class="logo flex">
        <img src="logo.png" alt="">
        <b>Mascotas Felices</b>
        
    </div>
    <div class="Items" id="items" #items>
        <div class="User-options">
             @if ((currentUser$ | async)?.rol == "V") {    
                <a routerLink="/vet" class="options">Consultas</a>
                <a routerLink="" class="options">Usuarios</a>
                <a routerLink="" class="options">Estadisticas</a>
            }@else{
                <a routerLink="/" class="options">Inicio</a>
                <a routerLink="/pets" class="options">Mascotas</a>
                <a routerLink="/services" class="options">Servicios</a>
                <a routerLink="/pets/myappointments" class="options">Mis citas</a>

                
            }
        </div>
        @if (!(currentUser$ | async)) {
            <div class="Nologin-options hide">
                <a routerLink="/auth/login" class="options auth flex">Iniciar Sesion</a>
                <a routerLink="/auth/register" class="options auth flex">Registrarse</a>
            </div>   
        }@else {
            <div class="login">
                <a (click)="log_out()" class="options">Cerrar Sesion</a>
                
                <img src="logo.png" alt="" class="profile">
            </div>
            
        }
        
    </div>  
    
    <div class="nav_toggle" #toggle (click)="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
        
    </div>
</header>
