<header class="header flex">
    <div class="img_logo" class="logo flex">
        <img src="logo.png" alt="">
        <b>Mascotas Felices</b>
        
    </div>
    <div class="Items" id="items" #items>
        <div class="User-options">
             @if (currentUser?.rol == "V") {    
                <a routerLink="" class="options">Consultas</a>
                <a routerLink="" class="options">Usuarios</a>
                <a routerLink="" class="options">Estadisticas</a>
            }@else{
                <a routerLink="" class="options">Inicio</a>
                <a routerLink="/pets" class="options">Mascotas</a>
                <a routerLink="" class="options">Servicios</a>
                
            }
            
        </div>
        @if (!currentUser) {
            <div class="Nologin-options hide">
                <a routerLink="/login" class="options auth flex">Iniciar Sesion</a>
                <a routerLink="/register" class="options auth flex">Registrarse</a>
            </div>   
        }@else {
            <img src="logo.png" alt="">
        }
        
    </div>  
    
    <div class="nav_toggle" #toggle (click)="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
        
    </div>
</header>
