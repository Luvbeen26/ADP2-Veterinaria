<div class="card flex-column">
    <div class="image-container">
        <img class="image-service" [src]="service.image" alt="">
    </div>
    <div class="info-service flex-column">
        <h2 class="name-service">{{service.name}}</h2>
        <p class="description-service">{{service.description}}</p>
    </div>
    <a class="primary_button" [routerLink]="service.route" [queryParams]="service.query">Agendar</a>
</div>
