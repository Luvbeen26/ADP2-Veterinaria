<div class="card">
  <!-- Menú superior derecho -->
  <div class="card-menu">
    
    <div class="card-menu">
      <button class="menu-btn" (click)="toggleMenu(); $event.stopPropagation()">⋮</button>

      <div 
        class="menu-dropdown" 
        [class.active]="menuOpen"
        (click)="$event.stopPropagation()"
      >
        @if (mascota) {
          <button (click)="editarMascota(mascota.id_mascota!); $event.stopPropagation()">Editar</button>
          <button (click)="openModal(mascota.id_mascota);">Ver cartilla medica</button>
        }

      </div>
    </div>


  </div>

  <img class="image-pet" 
       [src]="mascota?.especie === 'P' ? 'dog.jpeg' : 'cat.jpg'" 
       alt="{{mascota?.nombre}}">

  <div class="card-info">
    <h2 class="name-pet">{{mascota?.nombre}}</h2>
    <p class="type-pet">{{mascota?.especie === 'P' ? 'Perro' : 'Gato'}}</p>
    <p class="age-pet">Edad: {{calcularEdad(mascota?.fecha_nacimiento!)}} años</p>
    <p class="breed-pet">Raza: {{mascota?.raza_mascota?.descripcion}}</p>
    <p class="weight-pet">Peso: {{mascota?.peso}} kg</p>
  </div>

  <button class="delete-btn" (click)="eliminarMascota()">
    <mat-icon>delete</mat-icon>
  </button>
</div>

@if (cartillaData()) {
  <app-cartilla-mascota
    [cartilla]="cartillaData()!"
    (closed)="cartillaData.set(null)">
  </app-cartilla-mascota>
}
